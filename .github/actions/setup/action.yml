name: 'Setup'
description: 'Setup pnpm and node, install deps'
runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup node
      uses: actions/setup-node@v6.4.0
      with:
        node-version: 24
        registry-url: 'https://registry.npmjs.org'
        cache: 'pnpm'
        scope: '@mendabot'

    - name: Install deps
      shell: bash
      run: pnpm install --frozen-lockfile
