name: CI

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup
        uses: mendabot/actions/setup@32015b2383ed7504c8e0e99682e266b122564819 # main

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint
