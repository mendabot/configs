name: Release new version

on:
  workflow_dispatch:

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Configure git
        run: |
          mkdir -p ~/.ssh
          echo "$MENDABOT_SIGNING_KEY" > ~/.ssh/signing_key
          chmod 600 ~/.ssh/signing_key
          git config --global gpg.format ssh
          git config --global user.signingkey "$HOME/.ssh/signing_key"
          git config --global commit.gpgsign true
          git config --global user.name "Mendabot"
          git config --global user.email mendabot@pm.me
        env:
          MENDABOT_SIGNING_KEY: ${{ secrets.MENDABOT_SIGNING_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.WRITE_ACCESS_GIT_TOKEN }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

      - name: Make new version
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.WRITE_ACCESS_GIT_TOKEN }}
          GIT_AUTHOR_NAME: Mendabot
          GIT_AUTHOR_EMAIL: mendabot@pm.me
          GIT_COMMITTER_NAME: Mendabot
          GIT_COMMITTER_EMAIL: mendabot@pm.me
